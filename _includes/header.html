<header>
  <div class="container mt-3">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <!-- Brand -->
        <a class="navbar-brand" href="/">
          <img src="{{ '/assets/images/logo.png' | relative_url }}" height="35" alt="YGN Effects Logo"/>
        </a>

        <!-- Toggle button for mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            {% for entry in site.data.navigation %}
            <li class="nav-item">
              <a class="nav-link {% if entry.url == page.url %}active{% endif %}" href="{{ entry.url }}">{{ entry.title }}</a>
            </li>
            {% endfor %}
          </ul>

          <!-- GitHub link -->
          <div class="d-flex">
            <a class="nav-link" href="https://github.com/ygn-effects" target="_blank" aria-label="GitHub">
              <i class="fab fa-github fa-lg"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
