# Site settings
title: YGN Effects
email: contact@ygn-effects.com  # Update with your actual email
description: >-
  Open-source hardware framework for building professional guitar effects pedals.
  Complete PCB designs, firmware, and documentation for DIY builders.

baseurl: "" 
url: "https://ygn-effects.github.io"

github_username: ygn-effects

# Build settings
plugins:
  - jekyll-feed

collections:
  effects:
    output: true
    permalink: /effects/:name/
  docs:
    output: true
    permalink: /docs/:name/

defaults:
  - scope:
      path: ""
      type: "effects"
    values:
      layout: "effect"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"

exclude:
  - graphics/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
