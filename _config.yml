# Site settings
title: YGN Effects
email: contact@ygn-effects.com  # Update with your actual email
description: >-
  Open-source hardware framework for building professional guitar effects pedals.
  Complete PCB designs, firmware, and documentation for DIY builders.

baseurl: "" 
url: "https://ygn-effects.github.io"

github_username: ygn-effects

# Build settings
plugins:
  - jekyll-feed

collections:
  designs:
    output: true
    permalink: /designs/:name/
  docs:
    output: true
    permalink: /docs/:name/

defaults:
  - scope:
      path: ""
      type: "designs"
    values:
      layout: "design"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"

exclude:
  - graphics/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - claude.md
